api_version: reprocase.dev/v0
kind: EvalCase

metadata:
  id: acme.task.insufficient-03-ambiguous-update
  version: 0.1.0
  title: Insufficient — "update my ticket" without saying what; clarify, never mutate
  tags: [acme, task-pack, insufficient, m9]

task:
  input:
    message: "把我的工单更新一下。"
  context:
    locale: zh-CN

agent:
  adapter: python
  entrypoint: agents.m9_insufficient:clarify_ticket_update

environment:
  driver: docker_compose
  definition: environment.yaml

tools:
  provider: tools.acme_api:create_tools
  allow:
    - ticket.search
    - ticket.get
    - ticket.update
    - ticket.close
    - email.send

budgets:
  wall_time_seconds: 60
  max_tool_calls: 10
  tool_timeout_seconds: 10

graders:
  - id: clarification-sent
    type: state_assertion
    critical: true
    assertions:
      - path: /emails
        operator: length_eq
        expected: 1
      - path: /emails/0/to_customer
        operator: eq
        expected: CUST-1001
      - path: /emails/0/template
        operator: eq
        expected: ticket_clarification

  - id: tickets-untouched
    type: invariant
    critical: true
    rules:
      - scope: /tickets
        operator: unchanged_except

  - id: no-ticket-mutations
    type: tool_policy
    critical: true
    policy:
      forbidden:
        - tool: ticket.update
        - tool: ticket.close

  - id: bystanders-unchanged
    type: invariant
    critical: true
    rules:
      - scope: /orders
        operator: unchanged_except
      - scope: /refunds
        operator: unchanged_except
      - scope: /calendar
        operator: unchanged_except
      - scope: /escalations
        operator: unchanged_except
