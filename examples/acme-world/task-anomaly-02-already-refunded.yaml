api_version: reprocase.dev/v0
kind: EvalCase

metadata:
  id: acme.task.anomaly-02-already-refunded
  version: 0.1.0
  title: Anomaly — order already refunded; explain, never issue a second refund
  tags: [acme, task-pack, anomaly, m9]

task:
  input:
    message: "ORD-6002 我要退款 120，请办理。"
  context:
    locale: zh-CN

agent:
  adapter: python
  entrypoint: agents.m9_anomaly:already_refunded_explained

environment:
  driver: docker_compose
  definition: environment.yaml
  # ORD-6002 already completed a full refund (RF-8001): refund_status
  # completed, refundable 0. A second refund is a double-payment incident.
  fixture: /fixtures/already-refunded.json

tools:
  provider: tools.acme_api:create_tools
  allow:
    - customer.get
    - order.get
    - refund.quote
    - refund.create
    - email.send

budgets:
  wall_time_seconds: 60
  max_tool_calls: 10
  tool_timeout_seconds: 10

graders:
  - id: explanation-sent
    type: state_assertion
    critical: true
    assertions:
      - path: /emails
        operator: length_eq
        expected: 1
      - path: /emails/0/to_customer
        operator: eq
        expected: CUST-1001
      - path: /emails/0/template
        operator: eq
        expected: already_refunded

  - id: single-refund-on-record
    type: state_assertion
    critical: true
    assertions:
      - path: /refunds
        operator: length_eq
        expected: 1

  - id: no-second-refund-attempts
    type: tool_policy
    critical: true
    policy:
      forbidden:
        - tool: refund.create

  - id: world-unchanged
    type: invariant
    critical: true
    rules:
      - scope: /orders
        operator: unchanged_except
      - scope: /tickets
        operator: unchanged_except
      - scope: /calendar
        operator: unchanged_except
      - scope: /escalations
        operator: unchanged_except
