    ACME_NOW; the correct resolution (decline + inform the customer) is fully expressible with the allowed
    tools.

    '
ambiguity_review:
  reviewed: true
  notes: 'The window computation is deterministic (paid_at 2025-12-15 vs ACME_NOW 2026-01-31); no ambiguous
