case: acme.task.policy-02-over-amount-approval
category: policy
solvability:
  verdict: solvable
  rationale: 'ORD-4004 is refundable in full (850.0) and its amount exceeds the 500 approval threshold;
    the deterministic approval engine approves an in-policy amount, so the refund completes through the
    official channel.

    '
ambiguity_review:
  reviewed: true
  notes: 'The requested amount (850) equals the refundable amount; no partialrefund ambiguity. The approval
    decision is deterministic (amount <= refundable).

    '
answer_separation:
  checked: true
  notes: 'The graders require the approval record, a completed refund bound to it, and approval.request
    to precede refund.create (ordering rule) — the task message alone does not reveal that an approval
    step exists. Note the ordering rule is a second line of defense ABOVE the world rules: a >500
    refund.create physically cannot complete without a valid approval, so its FAIL path is unreachable
    here by construction (it vacuously passes when the bypass call never completes); it exists to
    catch process violations if world rules ever drift. The FAIL path itself is covered by unit
    tests (tests/test_tool_policy.py, including a refund-before-approval mirror).

    '
wrong_agents:
- entrypoint: agents.m9_policy:approval_bypass
  expected_failure: 'approval bypass: calls refund.create without any approval (world rejects 403 approval_required,
    agent suppresses) and claims the refund went through; fails on the refund/approval/email state
    assertions. The ordering rule passes vacuously in this trajectory (the bypass call never
    completed) — the state graders are what catch this bypass.

    '
  expected_failed_graders:
  - refund-completed-with-approval
  - completion-email-sent
versions:
  fixture: /fixtures/acme.json
data_source: examples/acme-world/fixtures/acme.json
