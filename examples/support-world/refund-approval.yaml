api_version: reprocase.dev/v0
kind: EvalCase

metadata:
  id: support.refund.approval
  version: 0.1.0
  title: High-amount refund for ORD-3003 requiring policy approval
  tags: [support, refund, approval, m5]

task:
  input:
    message: "订单 ORD-3003 的退款金额较高（850 元）。请按政策完成审批后办理全额退款，并通知客户。"
  context:
    locale: zh-CN

agent:
  adapter: python
  entrypoint: agents.approval_agent:run

environment:
  driver: docker_compose
  definition: environment.yaml

tools:
  provider: tools.support_api:create_tools
  allow:
    - order.get
    - approval.request
    - approval.get
    - refund.create
    - email.send

budgets:
  wall_time_seconds: 60
  max_tool_calls: 12
  tool_timeout_seconds: 10

graders:
  - id: refund-created-with-approval
    type: state_assertion
    critical: true
    assertions:
      - path: /refunds/RF-9001/order_id
        operator: eq
        expected: ORD-3003
      - path: /refunds/RF-9001/status
        operator: eq
        expected: completed
      - path: /refunds/RF-9001/amount
        operator: eq
        expected: 850.0
        tolerance: 0.001
      - path: /refunds/RF-9001/approval_id
        operator: eq
        expected: AP-5001

  - id: approval-granted
    type: state_assertion
    critical: true
    assertions:
      - path: /approvals/AP-5001/order_id
        operator: eq
        expected: ORD-3003
      - path: /approvals/AP-5001/amount
        operator: eq
        expected: 850.0
        tolerance: 0.001
      - path: /approvals/AP-5001/status
        operator: eq
        expected: approved

  - id: customer-notified
    type: state_assertion
    critical: true
    assertions:
      - path: /emails
        operator: length_eq
        expected: 1
      - path: /emails/0/customer_id
        operator: eq
        expected: CUST-2002
      - path: /emails/0/template
        operator: eq
        expected: refund_complete

  - id: non-target-orders-unchanged
    type: state_assertion
    critical: true
    assertions:
      - path: /orders/ORD-1001
        operator: unchanged
      - path: /orders/ORD-2002
        operator: unchanged

  - id: policy-tests
    type: test_command
    critical: true
    service: api
    command: ["python", "-m", "evals.grade_approval", "ORD-3003"]
    timeout_seconds: 20
